<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - 90 Days Work Readiness Accelerator</title>
  <link rel="stylesheet" href="css/workcss.css">
  <style>
    .register-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    
    .register-box {
      background: white;
      border-radius: 10px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .register-header h1 {
      color: #333;
      margin-bottom: 10px;
    }
    
    .register-header p {
      color: #666;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
      font-family: inherit;
    }
    
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }
    
    .role-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .role-option {
      flex: 1;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .role-option:hover {
      border-color: #667eea;
    }
    
    .role-option input {
      display: none;
    }
    
    .role-option.selected {
      border-color: #667eea;
      background: #f0f3ff;
    }
    
    .role-option .role-icon {
      font-size: 30px;
      margin-bottom: 10px;
    }
    
    .role-option .role-title {
      font-weight: 600;
      color: #333;
    }
    
    .error-message {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
    
    .error-message.show {
      display: block;
    }
    
    .register-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s;
    }
    
    .register-button:hover {
      transform: translateY(-2px);
    }
    
    .register-footer {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }
    
    .register-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    
    .password-requirements {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-box">
      <div class="register-header">
        <h1>Create Account</h1>
        <p>Join the 90 Days Work Readiness Accelerator</p>
      </div>
      
      <form id="registerForm">
        <div class="form-group">
          <label>I am a:</label>
          <div class="role-selector">
            <label class="role-option" id="roleEmployee">
              <input type="radio" name="userType" value="employee" required>
              <div class="role-icon">💼</div>
              <div class="role-title">Employee</div>
            </label>
            <label class="role-option" id="roleFreelancer">
              <input type="radio" name="userType" value="freelancer" required>
              <div class="role-icon">🎯</div>
              <div class="role-title">Freelancer</div>
            </label>
            <label class="role-option" id="roleEntrepreneur">
              <input type="radio" name="userType" value="entrepreneur" required>
              <div class="role-icon">🚀</div>
              <div class="role-title">Entrepreneur</div>
            </label>
          </div>
        </div>
        
        <div class="form-group">
          <label for="username">Full Name</label>
          <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6">
          <div class="password-requirements">At least 6 characters</div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
        </div>
        
        <div class="form-group">
          <label for="interests">Career Interests (Optional)</label>
          <textarea id="interests" name="interests" placeholder="e.g., Software Development, Marketing, Leadership..."></textarea>
        </div>
        
        <div class="form-group">
          <label for="goals">Learning Goals (Optional)</label>
          <textarea id="goals" name="goals" placeholder="What do you hope to achieve in 90 days?"></textarea>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <button type="submit" class="register-button">Create Account</button>
      </form>
      
      <div class="register-footer">
        <p>Already have an account? <a href="login.html">Sign in here</a></p>
        <p><a href="index.html">Back to Home</a></p>
      </div>
    </div>
  </div>
  
  <script src="auth.js"></script>
  <script>
    // Role selector interaction
    document.querySelectorAll('.role-option').forEach(option => {
      option.addEventListener('click', function() {
        document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
        this.classList.add('selected');
        this.querySelector('input').checked = true;
      });
    });
    
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const userType = document.querySelector('input[name="userType"]:checked').value;
      const interests = document.getElementById('interests').value;
      const goals = document.getElementById('goals').value;
      const errorMessage = document.getElementById('errorMessage');
      
      // Validate password match
      if (password !== confirmPassword) {
        errorMessage.textContent = 'Passwords do not match';
        errorMessage.classList.add('show');
        return;
      }
      
      const result = auth.register(username, email, password);
      
      if (result.success) {
        // Save additional profile information
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const user = users.find(u => u.email === email);
        if (user) {
          user.userType = userType;
          user.interests = interests;
          user.goals = goals;
          localStorage.setItem('users', JSON.stringify(users));
        }
        
        alert('Registration successful! Please log in.');
        window.location.href = 'login.html';
      } else {
        errorMessage.textContent = result.message;
        errorMessage.classList.add('show');
      }
    });
  </script>
</body>
</html>
